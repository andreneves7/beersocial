<!DOCTYPE html>
<html>
<head>
    <title>BeerSocial Download</title>
    <style>
        body { 
            font-family: Arial; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            background: #1a1a2e;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #f59e0b; margin-bottom: 10px; }
        p { color: #ccc; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 20px 40px;
            background: #f59e0b;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { background: #d97706; transform: scale(1.05); }
        .info { color: #888; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍺 BeerSocial</h1>
        <p>Projeto completo com Redis, MongoDB e Cassandra</p>
        <a href="/api/download-full" class="btn">📥 Download ZIP (600 KB)</a>
        <p class="info">Contém todo o código fonte + instruções GitHub</p>
    </div>
</body>
</html>
