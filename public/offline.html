<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeerSocial - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 1.5rem;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #f59e0b;
    }
    
    p {
      color: #9ca3af;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .retry-btn {
      background: #f59e0b;
      color: #1a1a2e;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .retry-btn:hover {
      background: #d97706;
      transform: translateY(-2px);
    }
    
    .beer-animation {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon beer-animation">🍺</div>
    <h1>Sem Conexão</h1>
    <p>
      Parece que estás offline. 
      Verifica a tua conexão à internet e tenta novamente.
    </p>
    <button class="retry-btn" onclick="location.reload()">
      Tentar Novamente
    </button>
  </div>
</body>
</html>
